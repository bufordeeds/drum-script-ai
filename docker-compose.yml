# DrumScript — `docker compose up --build` then open http://localhost:3000
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment: &app_env
      DATABASE_URL: postgresql://drumuser:drumpass@postgres:5432/drumtranscribe
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - job_data:/data

  ml_worker:
    build:
      context: .
      dockerfile: ml_worker/Dockerfile
    environment:
      <<: *app_env
      # Optional: alternative download URL for the Demucs htdemucs checkpoint (sha256 is verified)
      DRUMSCRIPT_DEMUCS_MIRROR: ${DRUMSCRIPT_DEMUCS_MIRROR:-https://huggingface.co/anchor-flux/demucs-htdemucs/resolve/main/htdemucs.th}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - job_data:/data
      - model_cache:/models   # model weights are downloaded once (~250 MB) and kept here

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: drumtranscribe
      POSTGRES_USER: drumuser
      POSTGRES_PASSWORD: drumpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drumuser -d drumtranscribe"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  job_data:
  model_cache:
